<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mr. Omar Academy</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#0a0f1f;--card:rgba(255,255,255,.055);--bd:rgba(255,255,255,.11);--tx:#eef1ff;--mu:#9aa4c7;--a:#7c5cff;--b:#22d3ee;--ok:#22c55e;--no:#ef4444;--wa:#f59e0b;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:light){:root:not([data-theme="dark"]){--bg:#f2f4ff;--card:rgba(255,255,255,.9);--bd:rgba(20,20,60,.12);--tx:#14173a;--mu:#5b6389}}
:root[data-theme="dark"]{--bg:#0a0f1f}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;font-family:'Plus Jakarta Sans',system-ui,sans-serif;background:var(--bg);color:var(--tx);min-height:100vh;background-image:radial-gradient(700px 450px at 100% -5%,rgba(124,92,255,.33),transparent),radial-gradient(550px 420px at 0% 8%,rgba(34,211,238,.2),transparent);background-attachment:fixed}
header{display:flex;justify-content:space-between;align-items:center;padding:12px 20px;position:sticky;top:env(safe-area-inset-top,0px);backdrop-filter:blur(14px);background:color-mix(in srgb,var(--bg) 72%,transparent);border-bottom:1px solid var(--bd);z-index:5;flex-wrap:wrap;gap:8px}
.logo{font-weight:800;font-size:19px;cursor:pointer;background:linear-gradient(90deg,var(--a),var(--b));-webkit-background-clip:text;background-clip:text;color:transparent}
nav{display:flex;gap:6px;flex-wrap:wrap}
main{max-width:1080px;margin:0 auto;padding:22px 16px 60px}
.btn{border:0;cursor:pointer;font-family:inherit;font-weight:600;color:#fff;padding:10px 18px;border-radius:12px;background:linear-gradient(135deg,var(--a),var(--b));transition:.2s;font-size:14px}
.btn:hover{transform:translateY(-2px);box-shadow:0 8px 22px rgba(124,92,255,.4)}
.btn.g{background:var(--card);border:1px solid var(--bd);color:var(--tx)}.btn.g.on{border-color:var(--a);background:rgba(124,92,255,.25)}
.btn.ok{background:var(--ok)}.btn.no{background:var(--no)}.btn.wa{background:var(--wa)}.btn.sm{padding:6px 12px;font-size:12.5px}.btn:disabled{opacity:.5;cursor:default;transform:none;box-shadow:none}
.card{background:var(--card);border:1px solid var(--bd);border-radius:20px;padding:18px;backdrop-filter:blur(10px)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:16px}
.g2{display:grid;grid-template-columns:1.6fr 1fr;gap:18px;align-items:start}
@media(max-width:800px){.g2{grid-template-columns:1fr}}
.course{cursor:pointer;transition:.25s;display:flex;flex-direction:column;gap:6px}
.course:hover{transform:translateY(-5px);border-color:var(--a)}
.ic{width:50px;height:50px;border-radius:15px;display:grid;place-items:center;font-size:25px;background:linear-gradient(135deg,var(--a),var(--b))}
h1{font-size:28px;margin:0 0 6px}h2{font-size:20px;margin:26px 0 12px}h3{margin:0 0 4px}
.mu{color:var(--mu);font-size:14px}
input,select,textarea{width:100%;padding:12px 14px;margin:6px 0 10px;border-radius:12px;border:1px solid var(--bd);background:var(--card);color:var(--tx);font-family:inherit;font-size:15px;outline:none}
select option{color:#000}textarea{min-height:90px;resize:vertical}
input:focus,textarea:focus,select:focus{border-color:var(--a)}
label{font-size:13px;color:var(--mu);font-weight:600}
.auth{max-width:420px;margin:30px auto}
.row{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.tag{padding:3px 10px;border-radius:99px;font-size:12px;font-weight:700;display:inline-block}
.t-p{background:rgba(245,158,11,.2);color:var(--wa)}.t-a{background:rgba(34,197,94,.2);color:var(--ok)}.t-r{background:rgba(239,68,68,.2);color:var(--no)}.t-i{background:rgba(124,92,255,.22);color:#a99bff}
.chip{display:inline-flex;gap:6px;align-items:center;padding:6px 12px;border-radius:99px;background:var(--card);border:1px solid var(--bd);font-size:13px;margin:0 6px 6px 0}
.old{text-decoration:line-through;color:var(--mu);margin-left:8px;font-size:15px}
.price{font-size:32px;font-weight:800;color:var(--b)}
.insta{background:linear-gradient(135deg,#f58529,#dd2a7b,#8134af);border-radius:16px;padding:16px;text-align:center;color:#fff;margin:12px 0}
.insta b{font-size:26px;letter-spacing:1px;display:block}
.tw{overflow-x:auto}table{width:100%;border-collapse:collapse;min-width:640px}
td,th{padding:10px;border-bottom:1px solid var(--bd);text-align:left;font-size:13.5px;vertical-align:middle}th{color:var(--mu);font-weight:600}
.thumb{width:52px;height:52px;object-fit:cover;border-radius:10px;cursor:pointer}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.75);display:grid;place-items:center;z-index:20;padding:14px}
.modal>div{background:var(--bg);border:1px solid var(--bd);border-radius:20px;padding:20px;width:100%;max-width:600px;max-height:92vh;overflow:auto}
iframe{width:100%;aspect-ratio:16/9;border:0;border-radius:14px}
.toast{position:fixed;bottom:calc(20px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);background:var(--a);color:#fff;padding:10px 20px;border-radius:12px;z-index:50;font-weight:600}
.hero{padding:28px;border-radius:24px;margin-bottom:22px;background:linear-gradient(135deg,rgba(124,92,255,.35),rgba(34,211,238,.2));border:1px solid var(--bd)}
.coupon{background:linear-gradient(90deg,#16a34a,#10b981);color:#fff;padding:12px 14px;border-radius:14px;margin:10px 0;font-weight:600;font-size:14px}
.ticket{border:2px dashed var(--ok);border-radius:16px;padding:14px;background:rgba(34,197,94,.08)}
.ticket b{font-size:20px;letter-spacing:2px;color:var(--ok)}
.stat{text-align:center}.stat b{font-size:30px;display:block;background:linear-gradient(90deg,var(--a),var(--b));-webkit-background-clip:text;background-clip:text;color:transparent}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:18px;overflow-x:auto}
.desc{white-space:pre-line;line-height:1.7;color:var(--tx)}
.steps{counter-reset:s;padding:0;list-style:none;margin:8px 0}.steps li{counter-increment:s;padding:6px 0 6px 34px;position:relative;font-size:14px}
.steps li:before{content:counter(s);position:absolute;left:0;top:5px;width:24px;height:24px;border-radius:50%;background:var(--a);color:#fff;display:grid;place-items:center;font-size:12px;font-weight:700}
#pw{background:#000;border-radius:14px;overflow:hidden}
.pl{position:relative;aspect-ratio:16/9;background:#000}.pl iframe{position:absolute;inset:0;width:100%;height:100%}
.ov{position:absolute;inset:0;display:flex;touch-action:manipulation;-webkit-tap-highlight-color:transparent;z-index:3}.z{flex:1;cursor:pointer}
.fl{position:absolute;top:50%;transform:translateY(-50%);background:rgba(0,0,0,.65);color:#fff;padding:14px 20px;border-radius:40px;font-weight:700;font-size:18px;opacity:0;pointer-events:none;transition:opacity .2s}
.fl.show{opacity:1}.fl.L{left:12%}.fl.R{right:12%}
.ctl{display:flex;gap:10px;align-items:center;padding:10px 12px;background:#12162b;color:#fff}.ctl input[type=range]{margin:0;padding:0;flex:1;accent-color:var(--a)}.ctl select{width:auto;margin:0;padding:5px;background:#222744;color:#fff;border:0}.ctl .mu{color:#c9d0f5;font-size:12px;white-space:nowrap}
.shield{position:absolute;inset:0;background:#000;display:none;place-items:center;text-align:center;z-index:6;color:#fff}
.shield.on{display:grid}
.shield .em{font-size:min(38vw,38vh);line-height:1}
.wm{position:absolute;z-index:4;pointer-events:none;color:#fff;opacity:.28;font-weight:700;font-size:clamp(11px,2.2vw,16px);text-shadow:0 0 4px #000;transition:all 1.5s;white-space:nowrap}
footer{text-align:center;padding:20px;color:var(--mu);font-size:12px}
</style>
</head>
<body>
<header><div class="logo" onclick="go('home')">🎓 Mr. Omar Academy</div><nav id="nav"></nav></header>
<main id="app"></main>
<footer>© Mr. Omar Academy · Online lessons made simple</footer>
<script>
const K='tp_db_v2';
let DB;try{DB=JSON.parse(localStorage.getItem(K))}catch(e){}
DB=DB||{};
DB.users=DB.users||[];DB.courses=DB.courses||[];DB.orders=DB.orders||[];DB.access=DB.access||[];DB.coupons=DB.coupons||[];
DB.settings=DB.settings||{insta:'01000000000',note:'Transfer the exact amount, then upload a clear screenshot of the receipt.',admin:'OMAR12'};
const save=()=>{try{localStorage.setItem(K,JSON.stringify(DB))}catch(e){toast('Storage full or blocked')}};

/* ===== Device lock: each student account is bound to ONE device ===== */
const DK='tp_dev_id';
function rawId(){return Math.random().toString(36).slice(2,10)+Math.random().toString(36).slice(2,10)+Date.now().toString(36)}
function getDevId(){
  let a=null,b=null;
  try{a=localStorage.getItem(DK)}catch(e){}
  try{const m=document.cookie.match(/(?:^|;\s*)tp_dev=([\w-]+)/);b=m&&m[1]}catch(e){}
  const id=a||b||rawId();
  try{localStorage.setItem(DK,id)}catch(e){}
  try{document.cookie='tp_dev='+id+';max-age=315360000;path=/;SameSite=Lax'}catch(e){}
  return id;
}
const DEVID=getDevId();
function devName(){
  const u=navigator.userAgent||'';
  const os=/iPhone/.test(u)?'iPhone':/iPad/.test(u)?'iPad':/Android/.test(u)?'Android':/Windows/.test(u)?'Windows':/Mac OS/.test(u)?'Mac':/Linux/.test(u)?'Linux':'Unknown';
  const br=/Edg\//.test(u)?'Edge':/OPR\//.test(u)?'Opera':/SamsungBrowser/.test(u)?'Samsung Browser':/Chrome|CriOS/.test(u)?'Chrome':/Firefox|FxiOS/.test(u)?'Firefox':/Safari/.test(u)?'Safari':'Browser';
  return os+' · '+br+' · '+screen.width+'×'+screen.height;
}
const devOK=u=>!u.dev||u.dev===DEVID;

let YTP=null,tk=null,tapT=null,lastTap={t:0,s:''};
let GD=[],wmT=null;
let S={me:null,admin:false,page:'home',cid:null,lid:null,pay:false,f:'all',q:'',elid:null,eid:null};
try{S.me=sessionStorage.getItem('me');S.admin=sessionStorage.getItem('adm')==='1'}catch(e){}
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Math.random().toString(36).slice(2,10);
const me=()=>DB.users.find(u=>u.id===S.me);
const course=id=>DB.courses.find(c=>c.id===id);
const lesson=(cid,lid)=>{const c=course(cid);return c&&{c,l:c.lessons.find(x=>x.id===lid)}};
const user=id=>DB.users.find(u=>u.id===id);
const fd=t=>new Date(t).toLocaleDateString('en-GB');
const fdt=t=>new Date(t).toLocaleString('en-GB',{dateStyle:'short',timeStyle:'short'});
const val=id=>($('#'+id)||{}).value||'';
function toast(t){const d=document.createElement('div');d.className='toast';d.textContent=t;document.body.appendChild(d);setTimeout(()=>d.remove(),3200)}
function go(p,o){S.page=p;if(o)Object.assign(S,o);if(p==='admin')S.page=S.admin?'a_dash':'a_login';render();scrollTo(0,0)}
function ytId(u){const m=String(u).match(/(?:v=|youtu\.be\/|embed\/|shorts\/)([\w-]{11})/);return m&&m[1]}
function modal(h){closeM();const d=document.createElement('div');d.className='modal';d.id='m';d.innerHTML='<div>'+h+'</div>';d.onclick=e=>{if(e.target===d)closeM()};document.body.appendChild(d)}
function closeM(){clearInterval(tk);clearInterval(wmT);GD.forEach(f=>f());GD=[];if(YTP){try{YTP.destroy()}catch(e){}YTP=null}const m=$('#m');m&&m.remove()}
function ask(msg,cb){window._cb=cb;modal(`<h3>${esc(msg)}</h3><div class="row" style="margin-top:16px;justify-content:flex-end"><button class="btn g" onclick="closeM()">Cancel</button><button class="btn" onclick="closeM();_cb()">Confirm</button></div>`)}
function askIn(msg,cb){window._cb=cb;modal(`<h3>${esc(msg)}</h3><input id="ai" type="text"><div class="row" style="justify-content:flex-end"><button class="btn g" onclick="closeM()">Cancel</button><button class="btn" onclick="const v=val('ai');closeM();_cb(v)">Save</button></div>`)}
const access=lid=>DB.access.find(a=>a.uid===S.me&&a.lid===lid);
const valid=a=>a&&a.views>0&&a.exp>Date.now();
const myCoupon=cid=>DB.coupons.find(k=>k.uid===S.me&&k.cid===cid&&k.status==='active');
const fin=(l,cp)=>cp?Math.round(l.price*(100-cp.pct)/100):l.price;
const ST={pending:['t-p','Pending'],approved:['t-a','Approved'],rejected:['t-r','Rejected']};
const stag=s=>`<span class="tag ${ST[s][0]}">${ST[s][1]}</span>`;
const pubLessons=c=>c.lessons.filter(l=>!l.hidden);

function render(){
  const nav=$('#nav'),app=$('#app'),p=S.page;
  if(p[0]==='a'&&p[1]==='_'){
    nav.innerHTML=S.admin?'<button class="btn g sm" onclick="go(\'home\')">View site</button><button class="btn no sm" onclick="outA()">Logout</button>':'<button class="btn g sm" onclick="go(\'home\')">Back to site</button>';
    return app.innerHTML=adminView();
  }
  /* kick out a logged-in student whose account is bound to another device */
  if(me()&&!devOK(me())){S.me=null;try{sessionStorage.removeItem('me')}catch(e){}toast('This account is linked to another device');}
  nav.innerHTML=me()?`<button class="btn g sm ${p==='home'?'on':''}" onclick="go('home')">Browse Courses</button><button class="btn g sm ${p==='my'?'on':''}" onclick="go('my')">My Courses</button><button class="btn no sm" onclick="outS()">Logout (${esc(me().name.split(' ')[0])})</button>`:'<button class="btn g sm" onclick="go(\'admin\')">🔐 Admin</button>';
  if(!me())return app.innerHTML=authView();
  app.innerHTML=p==='course'?courseView():p==='lesson'?lessonView():p==='my'?myView():homeView();
}
/* ================= STUDENT ================= */
let mode='login';
function authView(){
  const l=mode==='login';
  return `<div class="hero" style="text-align:center"><h1>Welcome to Mr. Omar Academy 👋</h1><div class="mu">Clear explanations · Online lessons · Real results</div></div>
  <div class="card auth"><h2 style="margin-top:0">${l?'Login':'Create Account'}</h2>
  ${l?'':'<label>Full name</label><input id="n" placeholder="Your name">'}
  <label>Username</label><input id="un" autocapitalize="off" placeholder="e.g. ahmed123">
  <label>Password</label><input id="pass" type="password" placeholder="••••••">
  <button class="btn" style="width:100%" onclick="${l?'login()':'reg()'}">${l?'Login':'Create Account'}</button>
  ${l?'':'<p class="mu" style="font-size:12.5px;text-align:center;margin:10px 0 0">📱 Your account will be locked to this device only.</p>'}
  <p class="mu" style="text-align:center;cursor:pointer" onclick="mode='${l?'reg':'login'}';render()">${l?"Don't have an account? Sign up":'Already have an account? Login'}</p></div>`;
}
function reg(){
  const n=val('n').trim(),un=val('un').trim().toLowerCase(),pw=val('pass');
  if(!n||un.length<3||pw.length<4)return toast('Fill all fields (username 3+, password 4+)');
  if(DB.users.some(u=>u.un===un))return toast('Username already taken');
  const u={id:uid(),name:n,un,pw,banned:false,date:Date.now(),dev:DEVID,devName:devName(),devDate:Date.now()};DB.users.push(u);save();setMe(u.id);toast('Account created ✅');
}
function login(){
  const un=val('un').trim().toLowerCase(),u=DB.users.find(u=>u.un===un&&u.pw===val('pass'));
  if(!u)return toast('Wrong username or password');
  if(u.banned)return toast('This account is suspended');
  if(u.dev&&u.dev!==DEVID)return toast('🔒 This account is linked to another device. Contact the admin to reset it.');
  if(!u.dev){u.dev=DEVID;u.devName=devName();u.devDate=Date.now();} /* old accounts bind on next login */
  u.lastLogin=Date.now();save();
  setMe(u.id);
}
function setMe(id){S.me=id;try{sessionStorage.setItem('me',id)}catch(e){}go('home')}
function outS(){S.me=null;try{sessionStorage.removeItem('me')}catch(e){}go('home')}
const cardGrid=()=>{
  const q=S.q.toLowerCase(),cs=DB.courses.filter(c=>!c.hidden&&c.name.toLowerCase().includes(q));
  return cs.map(c=>{const cp=myCoupon(c.id);return `<div class="card course" onclick="go('course',{cid:'${c.id}'})"><div class="ic">${esc(c.icon||'📘')}</div><h3 style="margin-top:8px">${esc(c.name)}</h3><div class="mu" style="min-height:40px">${esc((c.desc||'').slice(0,90))}</div>
  <div><span class="chip">📚 ${pubLessons(c).length} lessons</span>${cp?`<span class="tag t-a">🎁 Your coupon −${cp.pct}%</span>`:c.pct>0?`<span class="tag t-i">Repeat buyers −${c.pct}%</span>`:''}</div></div>`}).join('')||'<p class="mu">No courses found.</p>';
};
function homeView(){
  return `<div class="hero"><h1>Hi ${esc(me().name)} 👋</h1><div class="mu">Pick a course and start learning today.</div></div>
  <div class="row"><h2 style="margin:0">Available Courses</h2><input style="max-width:260px;margin:0" placeholder="🔎 Search courses" value="${esc(S.q)}" oninput="S.q=this.value;$('#cg').innerHTML=cardGrid()"></div>
  <div class="grid" id="cg" style="margin-top:14px">${cardGrid()}</div>`;
}
function courseView(){
  const c=course(S.cid);if(!c)return homeView();const cp=myCoupon(c.id);
  return `<button class="btn g sm" onclick="go('home')">← All courses</button>
  <div class="hero" style="margin-top:14px"><div class="ic" style="margin-bottom:10px">${esc(c.icon||'📘')}</div><h1>${esc(c.name)}</h1><div class="desc mu">${esc(c.desc)}</div></div>
  ${cp?`<div class="coupon">🎁 You have a personal ${cp.pct}% coupon for this course — it will be applied automatically on your next purchase.</div>`:c.pct>0?`<div class="coupon" style="background:linear-gradient(90deg,var(--a),var(--b))">💡 Buy any lesson here and get a personal ${c.pct}% coupon for your next purchase in this course.</div>`:''}
  <h2>Lessons</h2>
  ${pubLessons(c).map((l,i)=>{const a=access(l.id);return `<div class="card row" style="margin-bottom:12px"><div style="flex:1;min-width:220px"><div class="mu">Lesson ${i+1}</div><h3>${esc(l.title)}</h3>
  <span class="chip">👁 ${l.views} views</span><span class="chip">📅 ${l.days} days</span>${l.dur?`<span class="chip">⏱ ${esc(l.dur)}</span>`:''}${valid(a)?'<span class="tag t-a">Unlocked</span>':''}</div>
  <div style="text-align:right"><span class="price" style="font-size:24px">${fin(l,cp)} EGP</span>${fin(l,cp)<l.price?`<span class="old">${l.price}</span>`:l.old>l.price?`<span class="old">${l.old}</span>`:''}<br><button class="btn sm" style="margin-top:6px" onclick="go('lesson',{cid:'${c.id}',lid:'${l.id}',pay:false})">View details</button></div></div>`}).join('')||'<p class="mu">No lessons yet.</p>'}`;
}
function lessonView(){
  const x=lesson(S.cid,S.lid);if(!x||!x.l)return homeView();
  const {c,l}=x,a=access(l.id),cp=myCoupon(c.id),f=fin(l,cp),pend=DB.orders.some(o=>o.uid===S.me&&o.lid===l.id&&o.status==='pending');
  const save_=l.old>f?Math.round((l.old-f)/l.old*100):0;
  return `<button class="btn g sm" onclick="go('course')">← ${esc(c.name)}</button>
  <div class="g2" style="margin-top:14px"><div>
    <div class="card"><div class="mu">${esc(c.name)}</div><h1>${esc(l.title)}</h1>
    <span class="chip">👁 Watch up to <b>${l.views}</b> times</span><span class="chip">📅 Valid for <b>${l.days}</b> days</span>${l.dur?`<span class="chip">⏱ ${esc(l.dur)}</span>`:''}
    <h3 style="margin-top:14px">About this lesson</h3><div class="desc">${esc(l.desc)||'No description provided.'}</div></div>
    <div class="card" style="margin-top:14px"><h3>What you get</h3><ul class="steps" style="counter-reset:none"><li style="padding-left:0">✅ Full HD video lesson</li><li style="padding-left:0">✅ ${l.views} views within ${l.days} days from approval</li><li style="padding-left:0">✅ Re-buy anytime to add more views &amp; days on top of what's left</li>${c.pct>0?`<li style="padding-left:0">🎁 Personal ${c.pct}% coupon after your first purchase in this course</li>`:''}</ul></div>
  </div>
  <div class="card" style="position:sticky;top:80px">
    <div><span class="price">${f} EGP</span>${l.old>f?`<span class="old">${l.old}</span>`:''}</div>
    ${save_?`<span class="tag t-a">Save ${save_}%</span>`:''}
    ${cp?`<div class="coupon">🎁 Your ${cp.pct}% coupon applied</div>`:''}
    ${valid(a)?`<div class="ticket" style="margin:10px 0"><div class="mu">You own this lesson</div><b style="font-size:16px;letter-spacing:0">${a.views} views left</b><div class="mu">Expires ${fd(a.exp)}</div><button class="btn ok sm" style="margin-top:8px" onclick="watch('${l.id}')">▶ Watch now</button></div>`:''}
    ${pend?'<div class="coupon" style="background:var(--wa)">⏳ Your payment is under review</div>':''}
    ${S.pay?payBox(c,l,cp,f):`<button class="btn" style="width:100%;margin-top:10px;padding:14px;font-size:16px" onclick="S.pay=true;render()">${valid(a)?'Buy again (extend)':'Pay Now'}</button>`}

function guardOn(){
  const hide=()=>{try{if(YTP){YTP.pauseVideo();YTP.mute()}}catch(e){}const s=$('#sh');if(s){$('#sem').textContent=['🚫','📵','🙈'][Math.floor(Math.random()*3)];s.classList.add('on')}};
  const add=(t,ev,f)=>{t.addEventListener(ev,f);GD.push(()=>t.removeEventListener(ev,f))};
  add(document,'visibilitychange',()=>{if(document.hidden)hide()});
  add(window,'blur',hide);
  add(window,'pagehide',hide);
  add(document,'keyup',e=>{if(e.key==='PrintScreen'){try{navigator.clipboard.writeText('')}catch(_){}hide()}});
  add(document,'keydown',e=>{const k=(e.key||'').toLowerCase();if((e.metaKey&&e.shiftKey)||(e.ctrlKey&&['p','s','u'].includes(k))||e.key==='F12')hide()});
  add(document,'contextmenu',e=>e.preventDefault());
}

  if(x&&x.l){
    let a=DB.access.find(z=>z.uid===o.uid&&z.lid===o.lid);const add=x.l.days*864e5;
    if(a){a.views+=x.l.views;a.exp=Math.max(a.exp,Date.now())+add}else DB.access.push({uid:o.uid,cid:o.cid,lid:o.lid,views:x.l.views,exp:Date.now()+add});
    if(cp)cp.status='used';
    if(x.c.pct>0&&!DB.coupons.some(k=>k.uid===o.uid&&k.cid===o.cid))DB.coupons.push({id:uid(),uid:o.uid,cid:o.cid,code:'OMR-'+uid().slice(0,6).toUpperCase(),pct:x.c.pct,status:'active'});
  }
  o.status='approved';save();toast('Approved ✅ — lesson unlocked');render();
}
function a_students(){
  const same=u=>u.dev&&u.dev===DEVID;
  return `<h1>Students (${DB.users.length})</h1><p class="mu">Each student account is locked to the first device it was created/logged in from. Use “Reset device” to let a student switch to a new device.</p>
  <div class="card tw"><table style="min-width:900px"><tr><th>Name</th><th>Username</th><th>Joined</th><th>Purchases</th><th>Spent</th><th>Device</th><th>Status</th><th>Actions</th></tr>${DB.users.map(u=>{const os=DB.orders.filter(o=>o.uid===u.id&&o.status==='approved');
  const dv=u.dev?`<span class="tag t-i">🔒 Locked</span><br><span style="font-size:12.5px">${esc(u.devName||'Unknown device')}</span><br><span class="mu" style="font-size:11.5px">ID: ${esc(u.dev.slice(0,8))}${same(u)?' (this device)':''}</span><br><span class="mu" style="font-size:11.5px">since ${u.devDate?fdt(u.devDate):'-'}</span>`:'<span class="tag t-p">Not linked yet</span><br><span class="mu" style="font-size:11.5px">links on next login</span>';
  return `<tr><td><b>${esc(u.name)}</b></td><td>@${esc(u.un)}</td><td>${u.date?fd(u.date):'-'}</td><td>${os.length}</td><td>${os.reduce((s,o)=>s+o.amount,0)} EGP</td><td>${dv}</td><td>${u.banned?'<span class="tag t-r">Suspended</span>':'<span class="tag t-a">Active</span>'}</td>
  <td style="white-space:nowrap"><button class="btn g sm" onclick="resetDev('${u.id}')" ${u.dev?'':'disabled'}>Reset device</button> <button class="btn g sm" onclick="resetPw('${u.id}')">Reset pass</button> <button class="btn wa sm" onclick="ban('${u.id}')">${u.banned?'Unsuspend':'Suspend'}</button> <button class="btn no sm" onclick="delU('${u.id}')">Delete</button></td></tr>`}).join('')||'<tr><td colspan="8" class="mu">No students yet.</td></tr>'}</table></div>`;
}
function resetDev(id){ask('Unlink this student from their device? The next login will lock the account to the new device.',()=>{const u=user(id);if(!u)return;u.dev=null;u.devName=null;u.devDate=null;save();toast('Device reset ✅');render()})}
function resetPw(id){askIn('New password for this student (4+ chars):',p=>{if(p&&p.length>=4){user(id).pw=p;save();toast('Password updated ✅')}else toast('Too short')})}
function ban(id){const u=user(id);u.banned=!u.banned;save();render()}
function delU(id){ask('Delete this student and all their data?',()=>{DB.users=DB.users.filter(u=>u.id!==id);['orders','access','coupons'].forEach(k=>DB[k]=DB[k].filter(x=>x.uid!==id));save();render()})}
function a_coupons(){
  return `<h1>Coupons</h1><p class="mu">Each coupon belongs to one student and one course. It is created on a student's first approved purchase in a course with a coupon % set.</p>
  <div class="card tw"><table><tr><th>Code</th><th>Student</th><th>Course</th><th>Discount</th><th>Status</th><th></th></tr>${DB.coupons.map(k=>{const u=user(k.uid),c=course(k.cid);return `<tr><td><b>${esc(k.code)}</b></td><td>${esc(u?u.name:'?')}</td><td>${esc(c?c.name:'?')}</td><td>${k.pct}%</td><td>${k.status==='active'?'<span class="tag t-a">Active</span>':k.status==='held'?'<span class="tag t-p">Reserved</span>':'<span class="tag t-r">Used</span>'}</td><td><button class="btn no sm" onclick="delK('${k.id}')">Revoke</button></td></tr>`}).join('')||'<tr><td colspan="6" class="mu">No coupons issued yet.</td></tr>'}</table></div>`;
}
function delK(id){DB.coupons=DB.coupons.filter(k=>k.id!==id);save();render()}
function a_settings(){
  return `<div class="card auth" style="max-width:560px"><h2 style="margin-top:0">Settings</h2>
  <label>InstaPay number</label><input id="si" value="${esc(DB.settings.insta)}">
  <label>Payment instructions (shown to students)</label><textarea id="sn">${esc(DB.settings.note)}</textarea>
  <label>Admin password</label><input id="sp" type="text" value="${esc(DB.settings.admin)}">
  <button class="btn" style="width:100%" onclick="saveSet()">Save settings</button>
  <hr style="border:0;border-top:1px solid var(--bd);margin:18px 0"><button class="btn no" style="width:100%" onclick="wipe()">⚠ Reset ALL data</button></div>`;
}
function saveSet(){const p=val('sp').trim();if(p.length<4)return toast('Password too short');DB.settings.insta=val('si').trim();DB.settings.note=val('sn').trim();DB.settings.admin=p;save();toast('Settings saved ✅')}
function wipe(){ask('This deletes everything (courses, students, orders). Sure?',()=>{DB.users=[];DB.courses=[];DB.orders=[];DB.access=[];DB.coupons=[];save();go('home')})}
render();
</script>
</body>
</html>
